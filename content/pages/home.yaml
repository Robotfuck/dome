seoTitle: The Film — The Dome Sessions
seoDescription: A music documentary exploring sound, space and memory in the unfinished Dome of Tripoli, Lebanon.
title: The Dome Sessions
tagline: An exploration of sound, space, and memory.
heroImage: film-8.jpg
heroAlt: The monumental interior of the unfinished Dome in Tripoli
introHeading: The sound of an unfinished space.
shortSynopsis: In Tripoli, Lebanon, an unfinished experimental theatre becomes a meeting place for sound, architecture, and memory.
fullSynopsis: >-
  Designed by Oscar Niemeyer in 1962, the Dome at the Rachid Karami International Fair was never completed. Its raw concrete interior and unusual reverberation became the setting for a series of performances in which musicians respond to the space itself. The Dome Sessions follows the collaborative experiment and the building's place in the city's social and historical fabric, asking how art can reclaim abandoned spaces and reimagine their futures.
