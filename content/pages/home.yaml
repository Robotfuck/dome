vinylCtaCopy: |
  The Dome Sessions is also available as a double vinyl live album.

  The recordings also serve as part of the soundtrack for a film that examines the Dome’s place in Tripoli’s social and historical fabric. While the body of work reflects the many diverging currents of place and identity in Lebanon, its core lies in the power of how a shared idea or action can breathe new life into the abandoned. By utilizing and reclaiming the Dome as a site of collaboration, the project underscores the role of art in the preservation and reinterpretation of heritage.
