seoTitle: The Vinyl — The Dome Sessions
seoDescription: Listen to and discover the physical release of The Dome Sessions on vinyl.
title: The Vinyl
subtitle: Sound that carries the architecture.
introHeading: A space you can hear.
intro: The Dome Sessions invites listeners to a shared experience of space through sound.
description: >-
  The recordings emerged from the unique acoustic conditions of the unfinished Dome. Each artist adapted their approach to its lingering reverberation, letting the building become part of the music. What began as an individual curiosity evolved into a collaborative experiment. The recorded sessions also form part of the soundtrack of the film.
