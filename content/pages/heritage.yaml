seoTitle: Rachid Karami International Fair — UNESCO World Heritage Site
seoDescription: The Rachid Karami International Fair in Tripoli was inscribed on the UNESCO World Heritage List in 2023 and is also on the List of World Heritage in Danger.
title: A UNESCO World Heritage Site since 2023
subtitle: The Rachid Karami International Fair was inscribed on the World Heritage List and placed on the List of World Heritage in Danger in 2023.
heroImage: fair-1.jpg
heroAlt: View across the Rachid Karami International Fair from beneath its monumental concrete arcade in Tripoli
introduction: |
  Designed by Oscar Niemeyer between 1962 and 1967 and built until 1975, the Rachid Karami International Fair was planned as a large public exhibition complex for Tripoli. Its buildings, open spaces and gardens form one architectural ensemble. UNESCO recognizes the fair for its contribution to modern architecture and the cultural exchange embodied in the project. The World Heritage designation covers the fair complex as a whole—not the Dome alone.
benefits:
  - heading: International recognition
    body: |
      UNESCO recognizes the fair as a major work of 20th-century modern architecture in the Arab States, and as an exceptional example of cultural exchange between Brazilian modernism and the Arab Near East. That international recognition makes the fair’s architectural and cultural value visible to a wider public.
    visible: true
  - heading: A guide for conservation
    body: |
      UNESCO’s Conservation Management Plan sets out policies to guide conservation, restoration and future reuse. It gives site administrators, heritage specialists and future partners a shared reference for decisions that respect the fair’s significance.
    visible: true
  - heading: A shared future for the fair
    body: |
      UNESCO calls for inclusive management involving heritage authorities, professionals, academic organizations and civil society. Heritage Impact Assessments can help evaluate proposed rehabilitation or reuse while safeguarding the values for which the fair was inscribed.
    visible: true
siteCondition: |
  The designation does not itself guarantee funding or restoration. UNESCO also placed the fair on the List of World Heritage in Danger in 2023, citing serious conservation vulnerabilities, including aging concrete and structural stability concerns. The listing and conservation plan provide a framework for coordinated action.
